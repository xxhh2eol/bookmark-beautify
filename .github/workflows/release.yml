name: Release extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish (for example v0.1.2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected an existing vMAJOR.MINOR.PATCH tag' >&2
            exit 1
          fi

      # Keep automation available when backfilling a tag made before this workflow.
      - name: Check out automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out tagged extension
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test release packaging
        run: python3 -m unittest discover -s tests -p 'test_release.py' -v

      - name: Test tagged extension
        working-directory: source
        run: |
          node --test tests/*.test.cjs
          node --check app.js
          node --check background.js
          git diff --check

      - name: Package extension and extract release notes
        run: python3 scripts/package_release.py --source source --tag "$RELEASE_TAG" --output release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          package="release/bookmark-beautify-${RELEASE_TAG}.zip"
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft"; then
            if [[ "$(cat "$RUNNER_TEMP/release-draft")" == 'true' ]]; then
              gh release upload "$RELEASE_TAG" "$package" --clobber
              gh release edit "$RELEASE_TAG" --draft=false --title "$RELEASE_TAG" --notes-file release/release-notes.md
            elif gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$(basename "$package")"; then
              echo "Release ${RELEASE_TAG} already contains the package; leaving it unchanged."
            else
              gh release upload "$RELEASE_TAG" "$package"
            fi
          else
            gh release create "$RELEASE_TAG" "$package" --verify-tag --title "$RELEASE_TAG" --notes-file release/release-notes.md
          fi
