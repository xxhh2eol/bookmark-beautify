<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>收藏夹管理</title>
  <style>
    :root {
      --bg: #f4f6fa;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e5e9f2;
      --border-strong: #d3dae7;
      --text: #1f2733;
      --muted: #6b7688;
      --accent: #2563eb;
      --accent-soft: #eaf1ff;
      --accent-strong: #1d4ed8;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 1px 3px rgba(16, 24, 40, 0.08);
      color-scheme: light;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px 14px 14px;
      gap: 10px;
    }

    /* 顶栏：紧凑 */
    .topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 42px;
      padding: 5px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      font-size: 12px;
      white-space: nowrap;
    }

    .brand-badge {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 10px;
    }

    .search-box {
      flex: 1;
      max-width: 600px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 4px 30px 4px 28px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      outline: none;
      font-size: 12px;
      min-height: 27px;
      transition: border-color 0.15s, background 0.15s;
    }

    .search-box input::placeholder { color: var(--muted); }
    .search-box input:focus {
      border-color: var(--accent);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    .search-box .search-icon {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 12px;
      color: var(--muted);
      pointer-events: none;
    }

    .top-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

    .select {
      appearance: none;
      padding: 4px 24px 4px 8px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 12px;
      min-height: 27px;
      cursor: pointer;
      outline: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%;
      background-size: 5px 5px;
      background-repeat: no-repeat;
    }

    /* 三栏 */
    .workspace {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 0;
    }

    .panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      min-width: 0;
    }

    .workspace aside.panel {
      flex: 0 0 auto;
      min-width: 12.5%;
      max-width: 25%;
    }

    .workspace aside.panel:nth-of-type(1) { width: 250px; }
    .workspace aside.panel:nth-of-type(2) { width: 286px; }

    .panel-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 6px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }

    .panel-body::-webkit-scrollbar { width: 7px; }
    .panel-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }

    .resizer {
      flex: 0 0 auto;
      width: 12px;
      align-self: stretch;
      cursor: col-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .resizer::before {
      content: "";
      width: 2px;
      height: 40px;
      border-radius: 999px;
      background: var(--border-strong);
      opacity: 0.7;
      transition: background 0.15s, height 0.15s;
    }

    .resizer:hover::before,
    .resizer.dragging::before {
      background: var(--accent);
      height: 60px;
    }

    /* 网址聚合和右侧内容共用的行样式 */
    .domain-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 6px;
      border-radius: 7px;
      border: 1px solid transparent;
      line-height: 1.2;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s, border-color 0.15s;
      margin-bottom: 1px;
    }

    .domain-item:hover { background: var(--surface-2); }
    .domain-item.active {
      background: var(--accent-soft);
      border-color: #bcd3ff;
    }

    .domain-icon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 11px;
      color: #fff;
      flex-shrink: 0;
    }

    .domain-info { min-width: 0; flex: 1; }
    .domain-name {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .domain-sub {
      font-size: 10px;
      color: var(--muted);
      line-height: 1.15;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .domain-count {
      font-size: 10px;
      color: var(--muted);
      background: var(--surface-2);
      border-radius: 999px;
      padding: 1px 6px;
      line-height: 1.2;
      flex-shrink: 0;
    }

    .tree { list-style: none; font-size: 12px; line-height: 1.2; }
    .tree-item { margin: 1px 0; }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 6px;
      border-radius: 6px;
      border: 1px solid transparent;
      line-height: 1.2;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .tree-row:hover { background: var(--surface-2); }
    .tree-row.active {
      background: var(--accent-soft);
      border-color: #bcd3ff;
    }

    .tree-arrow { width: 12px; height: 12px; display: grid; place-items: center; font-size: 8px; color: var(--muted); flex-shrink: 0; transition: transform 0.2s; }
    .tree-row.expanded .tree-arrow { transform: rotate(90deg); }
    .tree-emoji { font-size: 12px; flex-shrink: 0; }
    .tree-label { min-width: 0; flex: 1; font-size: 12px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tree-count { font-size: 10px; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 1px 6px; line-height: 1.2; flex-shrink: 0; }

    .tree-children { list-style: none; padding-left: 16px; position: relative; display: none; }
    .tree-children.open { display: block; }
    .tree-children::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 3px;
      bottom: 6px;
      width: 1px;
      background: var(--border);
    }

    /* 右侧内容：列表，不是卡片 */
    .content-panel {
      flex: 1 1 auto;
      min-width: 0;
      width: 100%;
    }

    .content-head {
      display: none;
    }

    .bookmark-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 6px;
      width: 100%;
    }

    .bookmark-item .domain-name {
      font-weight: 500;
    }

    .bookmark-item .domain-count {
      max-width: 45%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
      width: 100%;
    }

    @media (max-width: 920px) {
      body { overflow: auto; }
      .app { height: auto; min-height: 100vh; }
      .workspace { display: block !important; }
      .resizer { display: none !important; }
      .workspace aside.panel,
      .workspace .content-panel {
        width: 100% !important;
        min-width: 100% !important;
        max-width: 100% !important;
        max-height: 380px;
      }
      .topbar { flex-wrap: wrap; }
      .search-box { order: 5; flex-basis: 100%; max-width: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-badge">🔖</span>
        收藏夹管理
      </div>
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.2-3.2" />
        </svg>
        <input id="searchInput" placeholder="搜索标题 / 网址 / 文件夹…" autocomplete="off" />
      </div>
      <div class="top-actions">
        <select class="select" id="sortSelect">
          <option value="default">默认排序</option>
          <option value="name">名称正序</option>
          <option value="name-desc">名称逆序</option>
          <option value="recent">最近添加</option>
        </select>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel">
        <div class="panel-body">
          <div id="domainList"></div>
        </div>
      </aside>

      <div class="resizer" id="resizeLeft" title="拖动调整宽度"></div>

      <aside class="panel">
        <div class="panel-body">
          <div class="tree" id="folderTree"></div>
        </div>
      </aside>

      <div class="resizer" id="resizeMid" title="拖动调整宽度"></div>

      <section class="panel content-panel">
        <div class="content-head"></div>
        <div class="bookmark-list" id="bookmarkList"></div>
      </section>
    </main>
  </div>

  <script>
    // ===== 状态 =====
    const state = {
      filterType: 'all',
      filterKey: 'all',
      search: '',
      sort: 'default'
    };

    let allBookmarks = [];
    let folderTree = [];
    let domains = [];

    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => [...document.querySelectorAll(sel)];

    // ===== 简单 eTLD+1 聚合 =====
    const suffixSet = new Set([
      'com.cn','net.cn','org.cn','gov.cn','com.hk','co.uk','com.tw','co.jp',
      'com.au','co.kr','com.br','com.mx','co.in','org.uk','net.uk','ac.cn'
    ]);

    function aggregateDomain(host) {
      let h = host.replace(/^www\./i, '');
      const parts = h.split('.');
      if (parts.length <= 2) return h;
      const last3 = parts.slice(-3).join('.');
      if (suffixSet.has(last3)) return last3;
      return parts.slice(-2).join('.');
    }

    function colorFor(text) {
      let hash = 0;
      const s = text.toLowerCase();
      for (let i = 0; i < s.length; i++) hash = ((hash << 5) - hash) + s.charCodeAt(i);
      const hue = Math.abs(hash) % 360;
      return `hsl(${hue}, 65%, 54%)`;
    }

    // ===== 从 chrome.bookmarks 构建数据 =====
    function collectBookmarks(nodes, parentPath) {
      const items = [];
      const folders = [];

      function walk(list, path) {
        for (const node of list) {
          if (node.url) {
            let host = '';
            try {
              host = new URL(node.url).hostname || '';
            } catch {
              host = '';
            }
            if (!host) continue;
            items.push({
              id: node.id,
              title: node.title || host,
              url: node.url,
              host,
              domain: aggregateDomain(host),
              folderId: node.parentId || '',
              folderPath: path,
              dateAdded: node.dateAdded || 0
            });
          } else if (node.children && node.children.length) {
            folders.push({
              id: node.id,
              title: node.title || '未命名',
              parentId: node.parentId || '',
              children: node.children
            });
            walk(node.children, path ? `${path} / ${node.title}` : (node.title || ''));
          }
        }
      }

      walk(nodes, parentPath);
      return { items, folders };
    }

    function computeDomainGroups(bookmarks) {
      const map = new Map();
      for (const b of bookmarks) {
        if (!map.has(b.domain)) {
          map.set(b.domain, { domain: b.domain, count: 0, color: colorFor(b.domain) });
        }
        const g = map.get(b.domain);
        g.count++;
      }
      return [...map.values()].sort((a, b) => b.count - a.count || a.domain.localeCompare(b.domain));
    }

    function buildFolderTree(nodes) {
      return nodes
        .filter(n => !n.url)
        .map(n => {
          const children = buildFolderTree(n.children || []);
          return {
            id: n.id,
            title: n.title || '未命名',
            children
          };
        });
    }

    async function loadChromeBookmarks() {
      if (!window.chrome || !chrome.bookmarks || typeof chrome.bookmarks.getTree !== 'function') {
        document.body.innerHTML = '<div class="empty-state"><span class="domain-name" style="font-size:14px">请作为 Chrome 扩展加载本页</span></div>';
        return;
      }

      const tree = await chrome.bookmarks.getTree();
      const roots = tree && tree[0] && tree[0].children ? tree[0].children : [];
      const { items, folders } = collectBookmarks(roots, '');
      allBookmarks = items;
      folderTree = buildFolderTree(roots);
      domains = computeDomainGroups(allBookmarks);
      renderDomains();
      renderFolders();
      renderContent();
    }

    // ===== 渲染 =====
    function folderById(id) {
      let found = null;
      (function walk(list) {
        for (const f of list) {
          if (f.id === id) { found = f; return; }
          if (f.children.length) walk(f.children);
        }
      })(folderTree);
      return found;
    }

    function collectFolderIds(folderId) {
      const ids = [];
      const walk = (f) => {
        ids.push(f.id);
        f.children.forEach(walk);
      };
      const root = folderById(folderId);
      if (root) walk(root);
      return ids;
    }

    function isMatch(b, filter) {
      const q = state.search.trim().toLowerCase();
      if (filter.type === 'domain' && b.domain !== filter.key) return false;
      if (filter.type === 'folder') {
        const ids = collectFolderIds(filter.key);
        if (!ids.includes(b.folderId)) return false;
      }
      if (q) {
        const hay = [b.title, b.url, b.host, b.domain, b.folderPath].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    }

    function sorted(list) {
      const arr = [...list];
      switch (state.sort) {
        case 'name': arr.sort((a, b) => a.title.localeCompare(b.title, 'zh-CN')); break;
        case 'name-desc': arr.sort((a, b) => b.title.localeCompare(a.title, 'zh-CN')); break;
        case 'recent': arr.sort((a, b) => (b.dateAdded || 0) - (a.dateAdded || 0)); break;
      }
      return arr;
    }

    function renderDomains() {
      const list = $('#domainList');
      if (!domains.length) {
        list.innerHTML = '<div class="empty-state">暂无收藏网址</div>';
        return;
      }
      list.innerHTML = domains.map(g => {
        const active = state.filterType === 'domain' && state.filterKey === g.domain;
        return `<div class="domain-item ${active ? 'active' : ''}" data-domain="${g.domain}">
          <span class="domain-icon" style="background:${g.color}">${g.domain[0].toUpperCase()}</span>
          <span class="domain-info">
            <span class="domain-name">${g.domain}</span>
          </span>
          <span class="domain-count">${g.count}</span>
        </div>`;
      }).join('');

      $$('#domainList .domain-item').forEach(el => {
        el.addEventListener('click', () => {
          const key = el.dataset.domain;
          if (state.filterType === 'domain' && state.filterKey === key) {
            state.filterType = 'all';
            state.filterKey = 'all';
          } else {
            state.filterType = 'domain';
            state.filterKey = key;
          }
          renderDomains();
          renderFolders();
          renderContent();
        });
      });
    }

    function renderFolders() {
      const counts = new Map();
      allBookmarks.forEach(b => counts.set(b.folderId, (counts.get(b.folderId) || 0) + 1));

      const renderTree = (items, deep) => items.map(f => {
        const direct = counts.get(f.id) || 0;
        const allInFolder = direct + f.children.reduce((sum, c) => sum + allCountOf(c, counts), 0);
        const expanded = deep < 1;
        const active = state.filterType === 'folder' && state.filterKey === f.id;
        return `<li class="tree-item">
          <div class="tree-row ${active ? 'active' : ''} ${expanded ? 'expanded' : ''}" data-folder="${f.id}" style="${deep ? '' : 'font-weight:600'}">
            ${f.children.length ? '<span class="tree-arrow">▶</span>' : '<span class="tree-arrow"></span>'}
            <span class="tree-emoji">📁</span>
            <span class="tree-label">${f.title}</span>
            <span class="tree-count">${allInFolder}</span>
          </div>
          ${f.children.length ? `<ul class="tree-children open">${renderTree(f.children, deep + 1)}</ul>` : ''}
        </li>`;
      }).join('');

      $('#folderTree').innerHTML = renderTree(folderTree, 0);

      $$('#folderTree .tree-row').forEach(row => {
        row.addEventListener('click', (e) => {
          const id = row.dataset.folder;
          if (e.target.closest('.tree-arrow')) {
            row.classList.toggle('expanded');
            const children = row.nextElementSibling;
            if (children) children.classList.toggle('open');
            return;
          }
          if (state.filterType === 'folder' && state.filterKey === id) {
            state.filterType = 'all';
            state.filterKey = 'all';
          } else {
            state.filterType = 'folder';
            state.filterKey = id;
          }
          renderDomains();
          renderFolders();
          renderContent();
        });
      });
    }

    function allCountOf(f, counts) {
      return (counts.get(f.id) || 0) + f.children.reduce((sum, c) => sum + allCountOf(c, counts), 0);
    }

    function renderContent() {
      const filter = { type: state.filterType, key: state.filterKey };
      let filtered = allBookmarks.filter(b => isMatch(b, filter));
      filtered = sorted(filtered);
      const list = $('#bookmarkList');

      if (!filtered.length) {
        list.innerHTML = '<div class="empty-state">暂无匹配网址</div>';
        return;
      }

      // 右侧与左侧“网址聚合”行样式完全一致
      list.innerHTML = filtered.map(b => {
        const color = colorFor(b.domain);
        return `<a class="domain-item bookmark-item" href="${b.url}" target="_blank" rel="noopener">
          <span class="domain-icon" style="background:${color}">${(b.title || b.host || '?')[0].toUpperCase()}</span>
          <span class="domain-info">
            <span class="domain-name">${b.url}</span>
          </span>
          <span class="domain-count">${b.folderPath || '未分类'}</span>
        </a>`;
      }).join('');
    }

    // ===== 顶栏事件 =====
    $('#searchInput').addEventListener('input', (e) => {
      state.search = e.target.value;
      renderContent();
    });

    $('#sortSelect').addEventListener('change', (e) => {
      state.sort = e.target.value;
      renderContent();
    });

    // ===== 拖动调整宽度 =====
    function enableResize(panel, resizer) {
      let startX = 0;
      let startPct = 0.2;
      let workspaceWidth = 1;

      resizer.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const workspace = document.querySelector('.workspace');
        workspaceWidth = workspace.clientWidth;
        startPct = panel.getBoundingClientRect().width / workspaceWidth;
        startX = e.clientX;
        resizer.classList.add('dragging');
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp, { once: true });
      });

      function onMove(e) {
        let pct = startPct + (e.clientX - startX) / workspaceWidth;
        pct = Math.max(0.125, Math.min(0.25, pct));
        panel.style.width = (pct * 100).toFixed(2) + '%';
      }

      function onUp() {
        document.removeEventListener('mousemove', onMove);
        resizer.classList.remove('dragging');
      }
    }

    enableResize(
      document.querySelector('.workspace aside.panel:nth-of-type(1)'),
      document.getElementById('resizeLeft')
    );
    enableResize(
      document.querySelector('.workspace aside.panel:nth-of-type(2)'),
      document.getElementById('resizeMid')
    );

    // ===== 初始化 =====
    loadChromeBookmarks();
  </script>
</body>
</html>
